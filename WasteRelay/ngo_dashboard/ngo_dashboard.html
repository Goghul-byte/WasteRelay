<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FeedBridge — NGO Dashboard</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #14231d;
      background: #f4f8f6;
      --ink: #14231d;
      --muted: #66756d;
      --line: #dce8e1;
      --surface: #ffffff;
      --accent: #168653;
      --accent-dark: #0d633d;
      --accent-soft: #e8f6ee;
      --high: #168653;
      --medium: #a96f0b;
      --low: #7d8c84;
      --danger: #b74848;
      --shadow: 0 12px 34px rgba(20, 50, 37, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(22, 134, 83, .08), transparent 30rem),
        linear-gradient(180deg, #f7faf8 0%, #f1f7f4 100%);
    }
    main { max-width: 1240px; margin: 0 auto; padding: 30px 22px 56px; }
    h1, h2, h3, p { margin-top: 0; }
    button, input, textarea, select { font: inherit; }
    .top { display: flex; justify-content: space-between; gap: 24px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      width: 44px; height: 44px; display: grid; place-items: center;
      color: #fff; font-size: 23px; border-radius: 13px;
      background: linear-gradient(145deg, #1b9a61, #0d633d);
      box-shadow: 0 8px 20px rgba(22, 134, 83, .22);
    }
    .top h1 { font-size: 24px; letter-spacing: -.02em; margin-bottom: 4px; }
    .sub { color: var(--muted); margin-bottom: 0; font-size: 14px; }
    .picker {
      display: flex; gap: 11px; align-items: center; background: rgba(255,255,255,.92);
      border: 1px solid var(--line); border-radius: 14px; padding: 9px 10px 9px 15px;
      box-shadow: 0 7px 22px rgba(20,35,29,.06);
    }
    .picker label { font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }
    select, input[type="number"], textarea {
      border: 1px solid #cad9d0; border-radius: 10px; padding: 10px 12px;
      color: var(--ink); background: #fff; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    select { min-width: 230px; }
    select:focus, input[type="number"]:focus, textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(22,134,83,.11);
    }

    .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 17px 18px; box-shadow: 0 7px 22px rgba(20,35,29,.045); }
    .stat small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 7px; font-weight: 700; }
    .stat strong { font-size: 25px; letter-spacing: -.02em; }
    .stat.accent { background: linear-gradient(145deg, #eaf8f0, #f4fbf7); border-color: #c8e8d5; }

    section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); margin-bottom: 20px; }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
    .card-head h2 { font-size: 17px; margin-bottom: 0; }
    .muted { color: var(--muted); font-size: 13px; }

    .preference-card { position: relative; overflow: hidden; border-color: #cfe7da !important; }
    .preference-card::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 5px;
      background: linear-gradient(180deg, #1d9c63, #0d633d);
    }
    .preference-title { display: flex; align-items: center; gap: 10px; }
    .preference-icon {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 10px; background: var(--accent-soft); color: var(--accent-dark);
    }
    .match-pill {
      display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px;
      border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark);
      font-size: 11.5px; font-weight: 800;
    }
    .match-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .preference-intro { color: var(--muted); font-size: 13px; margin: -3px 0 18px; max-width: 760px; }
    .preference-grid { display: grid; grid-template-columns: 1fr .8fr 1.4fr; gap: 14px; }
    .field {
      min-width: 0; padding: 14px; border: 1px solid #e2ebe6;
      border-radius: 13px; background: #fbfdfc;
    }
    .field.wide { grid-column: span 2; }
    .field.full { grid-column: 1 / -1; }
    .field-label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 7px; color: #3c4d44; }
    .field-help { color: var(--muted); font-size: 11.5px; margin: 7px 0 0; line-height: 1.4; }
    .capacity-wrap { display: flex; align-items: center; gap: 9px; }
    .capacity-wrap input { width: 120px; }
    .capacity-wrap span { font-size: 13px; color: var(--muted); font-weight: 700; }
    textarea { width: 100%; min-height: 72px; resize: vertical; line-height: 1.4; }

    .availability-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
    .availability-copy strong { display: block; font-size: 14px; }
    .availability-copy span { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
    .switch { position: relative; width: 48px; height: 27px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; border-radius: 999px; background: #bac6bf; cursor: pointer; transition: .2s; }
    .slider::before { content: ""; position: absolute; width: 21px; height: 21px; left: 3px; top: 3px; background: #fff; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: .2s; }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(21px); }

    .allergen-options { display: flex; gap: 7px; flex-wrap: wrap; }
    .allergen-options input { position: absolute; opacity: 0; pointer-events: none; }
    .allergen-options label {
      padding: 7px 10px; border: 1px solid #d6e2db; border-radius: 999px;
      background: #fff; color: #516159; font-size: 11.5px; font-weight: 750; cursor: pointer;
      transition: .15s;
    }
    .allergen-options input:checked + label { border-color: #d99340; background: #fff5e8; color: #8a520e; box-shadow: inset 0 0 0 1px #e8b16f; }
    .preference-actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 15px; flex-wrap: wrap; }
    .preference-note { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 7px; }
    .preference-note::before { content: "i"; display: grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: #edf3ef; color: #506158; font-size: 10px; font-weight: 900; }
    .save-wrap { display: flex; align-items: center; gap: 11px; }
    .save-feedback { min-height: 18px; color: var(--accent-dark); font-size: 11.5px; font-weight: 750; }
    .save-btn {
      border: 0; border-radius: 10px; padding: 10px 16px; color: #fff;
      background: linear-gradient(145deg, #1b955e, #0d6b41); font-size: 12.5px;
      font-weight: 800; cursor: pointer; box-shadow: 0 7px 16px rgba(22,134,83,.2);
    }
    .save-btn:hover { filter: brightness(.96); transform: translateY(-1px); }

    .restaurant-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .r-card { border: 1px solid #dfe9e3; border-radius: 14px; padding: 15px; background: linear-gradient(180deg, #fff, #fbfdfc); transition: box-shadow .15s, transform .15s, border-color .15s; cursor: default; }
    .r-card:hover { border-color: #c9dfd2; box-shadow: 0 8px 20px rgba(20,35,29,.09); transform: translateY(-2px); }
    .r-head { display: flex; justify-content: space-between; align-items: start; gap: 8px; margin-bottom: 8px; }
    .r-name { font-weight: 800; font-size: 14.5px; line-height: 1.25; }
    .r-dist { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800; padding: 4px 9px; border-radius: 999px; }
    .badge .dot { width: 7px; height: 7px; border-radius: 50%; }
    .badge.high { background: #e6f4ec; color: var(--high); } .badge.high .dot { background: var(--high); }
    .badge.medium { background: #fbf1dc; color: var(--medium); } .badge.medium .dot { background: var(--medium); }
    .badge.low, .badge.na { background: #eef1f0; color: var(--low); } .badge.low .dot, .badge.na .dot { background: var(--low); }
    .r-meta { font-size: 12.5px; color: #48534d; margin-top: 8px; display: grid; gap: 4px; }
    .r-meta span b { color: var(--ink); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid #e5ede8; }
    td { padding: 10px 10px; border-bottom: 1px solid #eef2f0; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    .status-tag { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: #eef1f0; color: #48534d; white-space: nowrap; }
    .status-tag.picked_up { background: #e6f4ec; color: var(--high); }
    .status-tag.awaiting_ngo_response { background: #eaf1fb; color: #2f6fb0; }
    .status-tag.unclaimed, .status-tag.cancelled { background: #fdecec; color: #b03434; }

    canvas { max-width: 260px; }
    .chart-row { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
    .legend { display: grid; gap: 6px; font-size: 13px; }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

    .empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 14px; }
    .loading { color: var(--muted); text-align: center; padding: 40px 10px; }

    @media (max-width: 900px) {
      .summary { grid-template-columns: repeat(2, 1fr); }
      .preference-grid { grid-template-columns: 1fr 1fr; }
      .field.wide { grid-column: span 2; }
    }
    @media (max-width: 600px) {
      main { padding: 20px 14px 42px; }
      .summary, .preference-grid { grid-template-columns: 1fr; }
      .field.wide, .field.full { grid-column: auto; }
      .picker { width: 100%; align-items: stretch; flex-direction: column; }
      select { width: 100%; min-width: 0; }
      section.card { padding: 18px; }
      .save-wrap { width: 100%; justify-content: space-between; }
      .save-btn { margin-left: auto; }
    }

    .request-btn {
      width: 100%; margin-top: 12px; padding: 10px 14px; border: 1px solid #cfe1d7;
      border-radius: 9px; cursor: pointer; color: var(--accent-dark); background: var(--accent-soft);
      font-weight: 750; font-size: 12.5px;
    }
    .request-btn:hover { background: #dff2e7; }
  </style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">↗</div>
      <div>
        <h1>NGO Dashboard</h1>
        <p class="sub">Receive the right food, at the right time, for the people you serve.</p>
      </div>
    </div>
    <div class="picker">
      <label for="ngo-select">Viewing as</label>
      <select id="ngo-select"><option value="">Loading NGOs…</option></select>
    </div>
  </div>

  <div id="app">
    <div class="loading">Select an NGO above to load its dashboard.</div>
  </div>
</main>

<script>
  const API_BASE = window.location.pathname.replace(/\/ngo-dashboard\/?$/, '');
  const dataUrl = `${API_BASE}/ngo-dashboard-data`;

  const select = document.getElementById('ngo-select');
  const app = document.getElementById('app');

  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function badgeClass(label) {
    if (label === 'High') return 'high';
    if (label === 'Medium') return 'medium';
    if (label === 'Low') return 'low';
    return 'na';
  }

  function formatQty(byUnit) {
    const entries = Object.entries(byUnit || {});
    if (!entries.length) return '—';
    return entries.map(([unit, qty]) => `${Math.round(qty * 10) / 10} ${unit}`).join(', ');
  }

  function statusLabel(status) {
    const map = {
      awaiting_ngo_response: 'Awaiting response',
      picked_up: 'Picked up',
      unclaimed: 'Unclaimed',
      cancelled: 'Cancelled',
      created: 'Created',
    };
    return map[status] || status || 'Unknown';
  }

  function preferenceStorageKey() {
    return `feedbridge-ngo-preferences:${select.value || 'preview'}`;
  }

  function updateAvailabilityCopy() {
    const accepting = document.getElementById('accepting-food');
    const title = document.getElementById('availability-title');
    const help = document.getElementById('availability-help');
    if (!accepting || !title || !help) return;
    title.textContent = accepting.checked ? 'Accepting food now' : 'Not accepting right now';
    help.textContent = accepting.checked ? 'Include us in new food offers' : 'Temporarily pause new food offers';
  }

  function readPreferenceForm() {
    return {
      accepting: document.getElementById('accepting-food').checked,
      peopleNeeded: document.getElementById('people-needed').value,
      blockedFoods: document.getElementById('blocked-foods').value.trim(),
      allergens: [...document.querySelectorAll('#allergen-options input:checked')].map(input => input.value),
    };
  }

  function loadPreferenceForm() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(preferenceStorageKey()) || 'null'); }
    catch (error) { saved = null; }
    if (!saved) {
      updateAvailabilityCopy();
      return;
    }

    document.getElementById('accepting-food').checked = saved.accepting !== false;
    document.getElementById('people-needed').value = saved.peopleNeeded || '';
    document.getElementById('blocked-foods').value = saved.blockedFoods || '';
    const selectedAllergens = new Set(saved.allergens || []);
    document.querySelectorAll('#allergen-options input').forEach(input => {
      input.checked = selectedAllergens.has(input.value);
    });
    updateAvailabilityCopy();
  }

  function bindPreferenceControls() {
    const accepting = document.getElementById('accepting-food');
    const saveButton = document.getElementById('save-preferences');
    const feedback = document.getElementById('save-feedback');
    const allergenInputs = [...document.querySelectorAll('#allergen-options input')];

    accepting.addEventListener('change', updateAvailabilityCopy);
    allergenInputs.forEach(input => input.addEventListener('change', () => {
      const noneInput = document.getElementById('allergen-none');
      if (input === noneInput && input.checked) {
        allergenInputs.filter(item => item !== noneInput).forEach(item => { item.checked = false; });
      } else if (input.checked) {
        noneInput.checked = false;
      }
    }));

    saveButton.addEventListener('click', () => {
      const preferences = readPreferenceForm();
      try {
        localStorage.setItem(preferenceStorageKey(), JSON.stringify(preferences));
        feedback.textContent = 'Details saved';
      } catch (error) {
        feedback.textContent = 'Could not save on this device';
      }
      window.setTimeout(() => { feedback.textContent = ''; }, 2500);
    });

    loadPreferenceForm();
  }

  function drawRescueDonut(canvas, pickedUp, unclaimed) {
    const ctx = canvas.getContext('2d');
    const total = pickedUp + unclaimed;
    const w = canvas.width, h = canvas.height, r = Math.min(w, h) / 2 - 6;
    ctx.clearRect(0, 0, w, h);
    if (total === 0) {
      ctx.fillStyle = '#8a94a0';
      ctx.font = '13px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('No data yet', w / 2, h / 2);
      return;
    }
    const cx = w / 2, cy = h / 2;
    const slices = [
      { value: pickedUp, color: '#1f8a54' },
      { value: unclaimed, color: '#d97a7a' },
    ];
    let start = -Math.PI / 2;
    slices.forEach(s => {
      const angle = (s.value / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, start + angle);
      ctx.closePath();
      ctx.fillStyle = s.color;
      ctx.fill();
      start += angle;
    });
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.58, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.fillStyle = '#14231d';
    ctx.font = 'bold 18px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${Math.round(100 * pickedUp / total)}%`, cx, cy - 4);
    ctx.font = '11px Inter, sans-serif';
    ctx.fillStyle = '#6d7d74';
    ctx.fillText('rescued', cx, cy + 14);
  }

  function render(data) {
    const trend = data.wastage_trend || {};
    const restaurants = data.nearby_restaurants || [];
    const records = data.donation_records || [];

    app.innerHTML = `
      <section class="card preference-card">
        <div class="card-head">
          <div class="preference-title">
            <div class="preference-icon" aria-hidden="true">✓</div>
            <div>
              <h2>Availability &amp; Food Preferences</h2>
              <span class="muted">Update what your NGO can safely receive today</span>
            </div>
          </div>
          <span class="match-pill">Used before sending an offer</span>
        </div>
        <p class="preference-intro">
          These details help FeedBridge avoid unsuitable matches and contact NGOs that can actually use the available food.
        </p>

        <div class="preference-grid">
          <div class="field">
            <span class="field-label">Current availability</span>
            <div class="availability-row">
              <div class="availability-copy">
                <strong id="availability-title">Accepting food now</strong>
                <span id="availability-help">Include us in new food offers</span>
              </div>
              <label class="switch" aria-label="Accepting food donations">
                <input id="accepting-food" type="checkbox" checked />
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="people-needed">People needing food today</label>
            <div class="capacity-wrap">
              <input id="people-needed" type="number" inputmode="numeric" min="0" max="10000" placeholder="e.g. 120" />
              <span>people</span>
            </div>
            <p class="field-help">Helps prevent sending too little or too much food.</p>
          </div>

          <div class="field">
            <label class="field-label" for="blocked-foods">Foods you cannot accept</label>
            <textarea id="blocked-foods" placeholder="e.g. Seafood, very spicy food, pork"></textarea>
            <p class="field-help">Separate multiple items with commas.</p>
          </div>

          <div class="field full">
            <span class="field-label">Allergies or dietary restrictions among recipients</span>
            <div class="allergen-options" id="allergen-options">
              <input id="allergen-nuts" type="checkbox" value="Nuts / Peanuts" /><label for="allergen-nuts">Nuts / Peanuts</label>
              <input id="allergen-dairy" type="checkbox" value="Dairy" /><label for="allergen-dairy">Dairy</label>
              <input id="allergen-gluten" type="checkbox" value="Gluten" /><label for="allergen-gluten">Gluten</label>
              <input id="allergen-eggs" type="checkbox" value="Eggs" /><label for="allergen-eggs">Eggs</label>
              <input id="allergen-shellfish" type="checkbox" value="Shellfish" /><label for="allergen-shellfish">Shellfish</label>
              <input id="allergen-none" type="checkbox" value="None known" /><label for="allergen-none">None known</label>
            </div>
            <p class="field-help">Select all that apply. Future matching can exclude food containing these allergens.</p>
          </div>
        </div>

        <div class="preference-actions">
          <span class="preference-note">This dashboard preview keeps your entries on this device only.</span>
          <div class="save-wrap">
            <span class="save-feedback" id="save-feedback" role="status"></span>
            <button class="save-btn" id="save-preferences" type="button">Save details</button>
          </div>
        </div>
      </section>

      <div class="summary">
        <div class="stat accent"><small>Restaurants in range</small><strong>${trend.restaurants_in_range ?? '—'}</strong></div>
        <div class="stat"><small>Total donations (area)</small><strong>${trend.total_donations ?? '—'}</strong></div>
        <div class="stat"><small>Picked up</small><strong>${trend.total_picked_up ?? '—'}</strong></div>
        <div class="stat"><small>Unclaimed</small><strong>${trend.total_unclaimed ?? '—'}</strong></div>
      </div>

      <section class="card">
        <div class="card-head">
          <h2>Nearby restaurants</h2>
          <span class="muted">Within the 15 km matching radius, sorted by distance</span>
        </div>
        <div class="restaurant-grid" id="restaurant-grid"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Area rescue rate</h2>
          <span class="muted">Picked up vs. unclaimed across nearby restaurants</span>
        </div>
        <div class="chart-row">
          <canvas id="rescue-chart" width="200" height="200"></canvas>
          <div class="legend">
            <span><i style="background:#1f8a54"></i> Picked up (${trend.total_picked_up ?? 0})</span>
            <span><i style="background:#d97a7a"></i> Unclaimed (${trend.total_unclaimed ?? 0})</span>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Your donation records</h2>
          <span class="muted">Most recent offers this NGO received</span>
        </div>
        <div id="records-wrap"></div>
      </section>
    `;

    const grid = document.getElementById('restaurant-grid');
    if (!restaurants.length) {
      grid.innerHTML = '<div class="empty">No restaurant activity in range yet.</div>';
    } else {
      grid.innerHTML = restaurants.map(r => {
        const s = r.surplus_likelihood || {};
        return `
          <div class="r-card">
            <div class="r-head">
              <div class="r-name">${esc(r.name)}</div>
              <div class="r-dist">${r.distance_km} km</div>
            </div>
            <span class="badge ${badgeClass(s.label)}"><span class="dot"></span>Surplus likelihood: ${esc(s.label)}</span>
            <button class="request-btn"
                    onclick='requestSurplusFood(${JSON.stringify(r)})'>
                Request Surplus Food
            </button>
            <div class="r-meta">
              <span>Donations logged: <b>${r.donation_count}</b></span>
              <span>Total quantity: <b>${formatQty(r.total_quantity_by_unit)}</b></span>
              <span>Most common category: <b>${esc(r.top_category || '—')}</b></span>
              <span>Picked up / Unclaimed: <b>${r.picked_up_count} / ${r.unclaimed_count}</b></span>
            
            </div>
            
          </div>`;
      }).join('');
    }

    drawRescueDonut(document.getElementById('rescue-chart'), trend.total_picked_up || 0, trend.total_unclaimed || 0);

    const recordsWrap = document.getElementById('records-wrap');
    if (!records.length) {
      recordsWrap.innerHTML = '<div class="empty">No donation offers recorded for this NGO yet.</div>';
    } else {
      recordsWrap.innerHTML = `
        <table>
          <thead><tr><th>Restaurant</th><th>Items</th><th>Distance</th><th>Status</th></tr></thead>
          <tbody>
            ${records.map(r => `
              <tr>
                <td>${esc(r.restaurant_name || '—')}</td>
                <td>${esc(r.items_summary || '—')}</td>
                <td>${r.distance_km != null ? r.distance_km + ' km' : '—'}</td>
                <td><span class="status-tag ${esc(r.status)}">${esc(statusLabel(r.status))}</span></td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    bindPreferenceControls();
  }

  async function loadNgoData(ngoId) {
    app.innerHTML = '<div class="loading">Loading dashboard…</div>';
    try {
      const res = await fetch(`${dataUrl}?ngo_id=${encodeURIComponent(ngoId)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load dashboard');
      render(data);
    } catch (err) {
      app.innerHTML = `<div class="empty">Could not load this NGO's dashboard (${esc(err.message)}).</div>`;
    }
  }

  async function loadNgoList() {
    try {
      const res = await fetch(dataUrl);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load NGOs');
      const ngos = data.ngos || [];
      if (!ngos.length) {
        select.innerHTML = '<option value="">No active NGOs found</option>';
        return;
      }
      select.innerHTML = '<option value="">Select an NGO…</option>' +
        ngos.map(n => `<option value="${esc(n.ngo_id)}">${esc(n.name)}</option>`).join('');
    } catch (err) {
      select.innerHTML = '<option value="">Could not load NGO list</option>';
    }
  }

  select.addEventListener('change', () => {
    if (select.value) loadNgoData(select.value);
    else app.innerHTML = '<div class="loading">Select an NGO above to load its dashboard.</div>';
  });

  loadNgoList();
  function requestSurplusFood(restaurant) {
    const phone = restaurant.phone || restaurant.restaurant_phone || "918754109503";

    if (!phone) {
        alert("Restaurant contact number is not available.");
        return;
    }

    const cleanPhone = String(phone).replace(/\D/g, "");

    const restaurantName =
        restaurant.restaurant_name ||
        restaurant.name ||
        "Restaurant";

    const message =
        `Hello ${restaurantName}, this is a request from FeedBridge. ` +
        `Our NGO is currently looking for surplus food. ` +
        `Do you have any surplus food available for donation today?`;

    window.open(
        `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`,
        "_blank"
    );
}
</script>
</body>
</html>
