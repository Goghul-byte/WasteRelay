AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FeedBridge - WhatsApp-native food rescue platform (AWS Zero Hunger Hackathon)

# Two params keep secrets out of the code - fill these in when you deploy
Parameters:
  WhatsAppToken:
    Type: String
    NoEcho: true
    Description: Permanent access token from Meta WhatsApp Cloud API
  WhatsAppPhoneNumberId:
    Type: String
    Description: Phone number ID from Meta WhatsApp Business dashboard
  WhatsAppVerifyToken:
    Type: String
    NoEcho: true
    Description: Any random string you choose - used to verify the webhook with Meta
  # ---------- Additive Control Center parameters ----------
  DashboardRestaurantId:
    Type: String
    Default: dashboard-control-center
    Description: Identifier used for donations created from the Control Center

  DashboardRestaurantName:
    Type: String
    Default: FeedBridge Control Center
    Description: Restaurant/display name stored on dashboard-created donations

  DashboardRestaurantPhone:
    Type: String
    Description: Verified restaurant WhatsApp number used only for later escalation messages

  DashboardRestaurantLat:
    Type: Number
    Default: 11.94
    Description: Dashboard restaurant latitude used by the existing NGO matcher

  DashboardRestaurantLng:
    Type: Number
    Default: 79.81
    Description: Dashboard restaurant longitude used by the existing NGO matcher 

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        DONATIONS_TABLE: !Ref DonationsTable
        NGOS_TABLE: !Ref NgosTable
        RESTAURANTS_TABLE: !Ref RestaurantsTable
        DISH_DICTIONARY_TABLE: !Ref DishDictionaryTable
        CONVERSATION_STATE_TABLE: !Ref ConversationStateTable
        WHATSAPP_TOKEN: !Ref WhatsAppToken
        WHATSAPP_PHONE_NUMBER_ID: !Ref WhatsAppPhoneNumberId
        WHATSAPP_VERIFY_TOKEN: !Ref WhatsAppVerifyToken

Resources:

  # ---------- API Gateway ----------
  FeedBridgeApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod

  # ---------- Lambda: receives every inbound WhatsApp message/button tap ----------
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.webhook_handler.lambda_handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DonationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NgosTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RestaurantsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DishDictionaryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationStateTable
      Events:
        WebhookGet:
          Type: Api
          Properties:
            RestApiId: !Ref FeedBridgeApi
            Path: /webhook
            Method: GET
        WebhookPost:
          Type: Api
          Properties:
            RestApiId: !Ref FeedBridgeApi
            Path: /webhook
            Method: POST

  # ---------- Lambda: runs every minute, checks accept-timers and safe-window deadlines ----------
  EscalationCheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.escalation_checker.lambda_handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DonationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NgosTable
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)

    # ---------- Additive Lambda: Control Center donation creation ----------


    # ---------- Additive Lambda: Control Center donation creation ----------
  DashboardCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.dashboard_handler.lambda_handler
      CodeUri: src/
      Environment:
        Variables:
          DASHBOARD_RESTAURANT_ID: !Ref DashboardRestaurantId
          DASHBOARD_RESTAURANT_NAME: !Ref DashboardRestaurantName
          DASHBOARD_RESTAURANT_PHONE: !Ref DashboardRestaurantPhone
          DASHBOARD_RESTAURANT_LAT: !Ref DashboardRestaurantLat
          DASHBOARD_RESTAURANT_LNG: !Ref DashboardRestaurantLng
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DonationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref NgosTable
        - DynamoDBReadPolicy:
            TableName: !Ref DishDictionaryTable
      Events:
        DashboardCreate:
          Type: Api
          Properties:
            RestApiId: !Ref FeedBridgeApi
            Path: /dashboard-create
            Method: POST

  # ---------- Additive Lambda: Control Center status + frontend ----------
  DashboardStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.dashboard_status.lambda_handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DonationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref NgosTable
      Events:
        DashboardStatus:
          Type: Api
          Properties:
            RestApiId: !Ref FeedBridgeApi
            Path: /dashboard-status
            Method: GET

        DashboardPage:
          Type: Api
          Properties:
            RestApiId: !Ref FeedBridgeApi
            Path: /dashboard
            Method: GET

  
  # ---------- Additive Lambda: NGO Dashboard (read-only) ----------
  NgoDashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ngo_dashboard_handler.lambda_handler
      CodeUri: ngo_dashboard/
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DonationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref NgosTable
      Events:
        NgoDashboardPage:
          Type: Api
          Properties:
            RestApiId: !Ref FeedBridgeApi
            Path: /ngo-dashboard
            Method: GET
        NgoDashboardData:
          Type: Api
          Properties:
            RestApiId: !Ref FeedBridgeApi
            Path: /ngo-dashboard-data
            Method: GET

  # ---------- DynamoDB Tables ----------
  DonationsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: feedbridge-donations
      PrimaryKey:
        Name: donation_id
        Type: String

  NgosTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: feedbridge-ngos
      PrimaryKey:
        Name: ngo_id
        Type: String

  RestaurantsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: feedbridge-restaurants
      PrimaryKey:
        Name: restaurant_id
        Type: String

  DishDictionaryTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: feedbridge-dish-dictionary
      PrimaryKey:
        Name: dish_name
        Type: String

  # keyed by WhatsApp phone number - tracks "what step is this chat on"
  ConversationStateTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: feedbridge-conversation-state
      PrimaryKey:
        Name: phone_number
        Type: String

Outputs:
  WebhookUrl:
    Description: Paste this into Meta's WhatsApp webhook config, with /webhook appended
    Value: !Sub "https://${FeedBridgeApi}.execute-api.${AWS::Region}.amazonaws.com/prod/webhook"

  DashboardUrl:
    Description: FeedBridge Control Center hosted by the existing prod API stage
    Value: !Sub "https://${FeedBridgeApi}.execute-api.${AWS::Region}.amazonaws.com/prod/dashboard"

  NgoDashboardUrl:
    Description: NGO Dashboard (read-only) hosted by the existing prod API stage
    Value: !Sub "https://${FeedBridgeApi}.execute-api.${AWS::Region}.amazonaws.com/prod/ngo-dashboard"
